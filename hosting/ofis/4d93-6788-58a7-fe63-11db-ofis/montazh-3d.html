<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Въже на стълбата 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Работилница: тъмен фон за 3D сцената, светъл панел със стъпките; оранжево за маркировки */
:root{
  --bg:#eceae6; --panel:#fbfaf8; --ink:#1f2328; --muted:#5d636b; --line:#d3d0c9; --mark:#d4621b; --btn:#1f2328; --btnfg:#fbfaf8;
  --scene:#dcd9d3;
  --f-head:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141619; --panel:#1d2024; --ink:#e7e5e0; --muted:#a2a7ae; --line:#363a40; --mark:#f08a45; --btn:#e7e5e0; --btnfg:#141619; --scene:#2a2d31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141619; --panel:#1d2024; --ink:#e7e5e0; --muted:#a2a7ae; --line:#363a40; --mark:#f08a45; --btn:#e7e5e0; --btnfg:#141619; --scene:#2a2d31; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.app{height:100%;display:grid;grid-template-columns:1fr 360px}
#view{position:relative;min-width:0;min-height:0;background:var(--scene)}
#view canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 8px}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding-left:18px;padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:18px;gap:14px;overflow:auto}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mark);font-weight:600}
h1{font:700 26px/1.1 var(--f-head);margin:0;text-wrap:balance}
#stepTitle{font:700 21px/1.2 var(--f-head);margin:0;text-wrap:balance}
#stepText{margin:0;max-width:60ch}
.parts{font-size:13px;color:var(--muted);margin:0}
.nav{display:flex;gap:8px;align-items:center}
button{font:600 14px var(--f-body);border-radius:6px;border:1px solid var(--btn);padding:9px 14px;cursor:pointer}
#next{background:var(--btn);color:var(--btnfg)} #prev,#replay{background:transparent;color:var(--ink)}
button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
#counter{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
ol{margin:0;padding-left:22px;display:grid;gap:3px;font-size:13px}
ol li{cursor:pointer;color:var(--muted)} ol li.on{color:var(--ink);font-weight:600}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin:0}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}#view{height:55vh}aside{border-left:0;border-top:1px solid var(--line)}html,body{height:auto}}
</style>

<div class="app">
  <div id="view"><div class="hint">Влачете за въртене · колелце/два пръста за мащаб</div></div>
  <aside>
    <div>
      <div class="eyebrow">Монтаж на 1 въже · стъпка по стъпка</div>
      <h1>Въже на стълбата</h1>
    </div>
    <div style="display:grid;gap:8px">
      <div class="eyebrow" id="stepNo">Стъпка 0</div>
      <h2 id="stepTitle"></h2>
      <p id="stepText"></p>
      <p class="parts" id="stepParts"></p>
    </div>
    <div class="nav">
      <button id="prev" type="button">Назад</button>
      <button id="next" type="button">Напред</button>
      <button id="replay" type="button" title="Покажи стъпката отново">↻</button>
      <span id="counter"></span>
    </div>
    <ol id="list"></ol>
    <p class="note">Детайлите са уголемени и разстоянието таван–стъпало е съкратено, за да се вижда всичко. Повтаря се за всяко от 22-те въжета.</p>
  </aside>
</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
const STEPS=[
 {t:'Крайният резултат',d:'Така изглежда едно въже: горе ринг болт в анкер в тавана, долу ринг болт през стъпалото и обтегач. Въжето е черно стоманено с PVC, с уши, затворени с алуминиеви гилзи (кримпване).',p:'',cam:'all'},
 {t:'Маркирайте точката на стъпалото',d:'На шперплата, ~3 см от металната рамка откъм стаята. На всяко стъпало две точки.',p:'Молив, ролетка',cam:'bottom'},
 {t:'Пренесете точката на тавана',d:'Отвес (тежест на конец) или лазер от точката долу. Където виси отвесът, маркирате тавана. Така всяко въже ще е точно отвесно.',p:'Отвес или лазер',cam:'all'},
 {t:'Пробийте тавана',d:'Перфоратор, свредло SDS Ø10, ~32 мм дълбоко. Издухайте праха от дупката.',p:'Свредло SDS Ø10',cam:'top'},
 {t:'Набийте анкера',d:'Анкерът Fischer EA II М8 влиза в дупката. С инструмента за набиване и няколко удара с чук се разпъва и застава здраво.',p:'Анкер EA II М8×30, инструмент за набиване, чук',cam:'top'},
 {t:'Завийте ринг болта горе',d:'Ринг болтът М8 (DIN 580) се завива в анкера на ръка, докато стегне.',p:'Ринг болт М8',cam:'top'},
 {t:'Пробийте стъпалото',d:'Свредло Ø9 през шперплата в маркираната точка. Металът на рамката не се пипа.',p:'Свредло за дърво Ø9',cam:'bottom'},
 {t:'Ринг болт долу + шайба и гайка',d:'Отгоре ринг болт М8 през дупката. Отдолу широка шайба и гайка М8. Стегнете с ключ 13. (Изгледът е отдолу, под стъпалото.)',p:'Ринг болт М8, шайба М8 широка, гайка М8',cam:'under'},
 {t:'Закачете обтегача',d:'Отворете обтегача докрай (развъртете тялото), после закачете куката му в халката на стъпалото.',p:'Обтегач ухо-кука М6',cam:'bottom'},
 {t:'Ухо горе: гилза + кримпване',d:'Махнете ~4 см PVC от края с макетно ножче. Нанижете алуминиевата гилза, прекарайте края през халката на тавана и го върнете обратно в гилзата, така че да остане ~1 см навън. Стиснете гилзата с кримпващите клещи 2–3 пъти по дължината ѝ.',p:'Черно стоманено въже с PVC 6 мм (стомана 4 мм), гилза DIN 3093 за 4 мм, кримпващи клещи, макетно ножче',cam:'top'},
 {t:'Ухо долу: гилза + кримпване',d:'Обтегачът е отворен докрай. Опънете въжето на ръка до ухото му и отбележете. Отрежете с ~8 см запас (клещи за стоманено въже), махнете 4 см PVC, нанижете гилзата, прекарайте през ухото на обтегача, върнете в гилзата и я стиснете.',p:'Гилза DIN 3093 за 4 мм, кримпващи клещи, клещи-резачки за стоманено въже',cam:'beye'},
 {t:'Опънете с обтегача',d:'Въртите тялото на обтегача: той се скъсява и изпъва въжето като струна. Спрете, когато въжето не се огъва при натиск.',p:'',cam:'all'},
 {t:'Готово, следващото въже',d:'Повтаряте за всички 22 въжета. Започнете от средното стъпало и проверете, преди да продължите с останалите.',p:'',cam:'all'}
];
const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));view.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.01,50);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(2,4,3);scene.add(sun);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:.1},o));
const zinc=M(0xb9bec4,{metalness:.7,roughness:.35}), dark=M(0x26292d,{metalness:.5,roughness:.5}), rope=M(0x141518,{roughness:.9}),
      ply=M(0xc79b68,{roughness:.8}), concrete=M(0x9a9893,{transparent:true,opacity:.55,roughness:.95}), orange=new THREE.MeshBasicMaterial({color:0xd4621b}), brass=M(0xc9a64a,{metalness:.6,roughness:.35});
const add=(m,p)=>{(p||scene).add(m);return m;};
const box=(w,h,d,mat)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
const cyl=(r,h,mat,seg=24)=>new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat);
// --- статични: таван и стъпало
const CY=2.0, TY=0.45; // долен ръб на тавана, горен ръб на шперплата
add(box(1.4,0.3,0.9,concrete)).position.set(0,CY+0.15,0);
const frame=new THREE.Group();add(frame);
[[0.92,0.05,0.04,0,TY-0.025,0.27],[0.92,0.05,0.04,0,TY-0.025,-0.27],[0.04,0.05,0.58,0.44,TY-0.025,0],[0.04,0.05,0.58,-0.44,TY-0.025,0]].forEach(a=>{const b=box(a[0],a[1],a[2],dark);b.position.set(a[3],a[4],a[5]);frame.add(b);});
add(box(0.84,0.05,0.5,ply)).position.set(0,TY-0.025,0);
const stringer=box(0.06,0.14,1.6,dark);stringer.position.set(-0.47,TY-0.09,0);stringer.rotation.x=0;add(stringer);
// --- части
function ringBolt(){const g=new THREE.Group();const sh=cyl(0.011,0.09,zinc,12);sh.position.y=-0.045;g.add(sh);
  const col=cyl(0.02,0.012,zinc);col.position.y=0.006;g.add(col);
  const r=new THREE.Mesh(new THREE.TorusGeometry(0.04,0.011,10,28),zinc);r.position.y=0.052;g.add(r);return g;}
const P={};
P.markB=add(new THREE.Mesh(new THREE.CircleGeometry(0.018,20),orange));P.markB.rotation.x=-Math.PI/2;P.markB.position.set(0,TY+0.002,0);
P.markT=add(new THREE.Mesh(new THREE.CircleGeometry(0.018,20),orange));P.markT.rotation.x=Math.PI/2;P.markT.position.set(0,CY-0.002,0);
P.plumb=new THREE.Group();add(P.plumb);{const l=cyl(0.002,CY-TY-0.06,orange,6);l.position.y=(CY+TY+0.06)/2;P.plumb.add(l);const w=new THREE.Mesh(new THREE.ConeGeometry(0.02,0.05,16),orange);w.rotation.x=Math.PI;w.position.y=TY+0.035;P.plumb.add(w);}
P.holeT=add(cyl(0.022,0.12,M(0x2f2f2f),16));P.holeT.position.set(0,CY+0.06,0);
P.drillT=new THREE.Group();add(P.drillT);{const b=cyl(0.02,0.3,zinc,8);b.position.y=0.15;P.drillT.add(b);const c=cyl(0.05,0.12,M(0x2e6db4),16);c.position.y=-0.06;P.drillT.add(c);}
P.anchor=new THREE.Group();add(P.anchor);{const a=cyl(0.02,0.12,brass,16);a.position.y=0.06;P.anchor.add(a);const lip=cyl(0.026,0.008,brass,16);lip.position.y=0.004;P.anchor.add(lip);}
P.tool=new THREE.Group();add(P.tool);{const t=cyl(0.014,0.22,zinc,12);t.position.y=-0.11;P.tool.add(t);const h=box(0.05,0.08,0.16,dark);h.position.set(0,-0.28,0.02);P.tool.add(h);}
P.ringT=ringBolt();P.ringT.rotation.x=Math.PI;add(P.ringT);
P.holeB=add(cyl(0.02,0.052,M(0x2f2f2f),16));P.holeB.position.set(0,TY-0.025,0);
P.drillB=new THREE.Group();add(P.drillB);{const b=cyl(0.018,0.25,zinc,8);b.position.y=-0.125;P.drillB.add(b);const c=cyl(0.05,0.12,M(0x2e6db4),16);c.position.y=0.06;P.drillB.add(c);}
P.ringB=ringBolt();add(P.ringB);
P.washer=add(new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.006,24),zinc));
P.nut=add(new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.016,6),zinc));
// обтегач: кука долу, тяло, ухо горе
P.tb=new THREE.Group();add(P.tb);
const tbBody=new THREE.Group();P.tb.add(tbBody);
[-1,1].forEach(s=>{const bar=box(0.008,0.16,0.012,zinc);bar.position.set(s*0.018,0,0);tbBody.add(bar);});
[-1,1].forEach(s=>{const boss=cyl(0.012,0.02,zinc,12);boss.position.y=s*0.08;tbBody.add(boss);});
const tbHook=new THREE.Group();P.tb.add(tbHook);{const s=cyl(0.006,0.07,zinc,8);s.position.y=0.035;tbHook.add(s);
  const h=new THREE.Mesh(new THREE.TorusGeometry(0.028,0.006,8,20,Math.PI*1.4),zinc);h.rotation.z=Math.PI*0.3;h.position.y=-0.025;tbHook.add(h);}
const tbEye=new THREE.Group();P.tb.add(tbEye);{const s=cyl(0.006,0.07,zinc,8);s.position.y=-0.035;tbEye.add(s);
  const e=new THREE.Mesh(new THREE.TorusGeometry(0.022,0.006,8,20),zinc);e.position.y=0.022;tbEye.add(e);}
// черно стоманено въже с PVC (6 мм): ухо през халката, затворено с алуминиева гилза (кримпване)
let ropeMesh=null;
const TH_R=0.024, ZM=-0.0065, ZT=0.0065; // радиус на ухото; главното въже и опашката (по z)
function eyePath(cy,dir,tail){ // dir=-1: ухото е горе; +1: ухото е долу
  const pts=[], R=TH_R;
  pts.push(new THREE.Vector3(0,cy+dir*(R+tail),ZT));
  pts.push(new THREE.Vector3(0,cy+dir*(R+0.03),ZT));
  for(let i=0;i<=18;i++){const a=(-60+i*(300/18))*Math.PI/180;pts.push(new THREE.Vector3(0,cy-dir*Math.sin(a)*R,Math.cos(a)*R*0.8));}
  pts.push(new THREE.Vector3(0,cy+dir*(R+0.03),ZM));
  return pts;}
function buildRope(attach,sag){
  if(ropeMesh){scene.remove(ropeMesh);ropeMesh.geometry.dispose();}
  const cyT=CY-0.092, ep=eyePos(), cyB=ep.y+0.022;
  let pts=eyePath(cyT,-1,0.085);
  const startY=cyT-TH_R-0.03, endY=attach>0?cyB+TH_R+0.03:1.15;
  pts.push(new THREE.Vector3(sag*0.12,(startY+endY)/2,ZM+sag*0.03));
  if(attach>0){pts=pts.concat(eyePath(cyB,1,0.085).reverse());}
  else{pts.push(new THREE.Vector3(0.02,endY,ZM));pts.push(new THREE.Vector3(0.08,endY-0.12,ZM));pts.push(new THREE.Vector3(0.14,endY-0.2,ZM+0.04));}
  ropeMesh=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),260,0.0055,8,false),rope);scene.add(ropeMesh);
  HW.top.position.set(0,cyT,0); HW.bot.position.set(0,cyB,0);
}
const alu=M(0xc9cdd2,{metalness:.8,roughness:.3});
function ferrule(dir){ // алуминиева гилза + оголен край (без PVC) + клещи за кримпване
  const g=new THREE.Group();
  const f=cyl(0.011,0.04,alu,20);f.scale.z=1.75;f.position.y=dir*(TH_R+0.05);g.add(f);
  [-0.01,0.01].forEach(d=>{const m=new THREE.Mesh(new THREE.TorusGeometry(0.011,0.0018,6,20),M(0x8d9297));m.rotation.x=Math.PI/2;m.scale.y=1.75;m.position.y=dir*(TH_R+0.05)+d;g.add(m);});
  const bare=cyl(0.004,0.02,zinc,8);bare.position.set(0,dir*(TH_R+0.08),ZT);g.add(bare); // края без PVC
  // клещи: две челюсти и дръжки (видими само при кримпването)
  const pl=new THREE.Group();pl.position.y=dir*(TH_R+0.05);g.add(pl);g.userData.pl=pl;
  const jawA=new THREE.Group(),jawB=new THREE.Group();pl.add(jawA);pl.add(jawB);
  [[jawA,1],[jawB,-1]].forEach(([j,s])=>{const jaw=box(0.03,0.03,0.05,M(0x2b2f35,{metalness:.5}));jaw.position.set(s*0.03,0,0);j.add(jaw);
    const h=box(0.02,0.018,0.32,M(0xc0392b));h.position.set(s*0.035,0,0.19);j.add(h);});
  g.userData.jaws=[jawA,jawB];
  return g;}
const HW={top:ferrule(-1),bot:ferrule(1)};scene.add(HW.top);scene.add(HW.bot);
// крайни позиции
const FINAL={
  anchor:new THREE.Vector3(0,CY,0), ringT:new THREE.Vector3(0,CY,0),
  ringB:new THREE.Vector3(0,TY,0), washer:new THREE.Vector3(0,TY-0.053,0), nut:new THREE.Vector3(0,TY-0.065,0)};
let tl=1, bodyRot=0; // обтегач: 1 = отворен, 0 = опънат
function hookPos(){return new THREE.Vector3(0,TY+0.092,0);}
function eyePos(){return new THREE.Vector3(0,TY+0.33+0.08*tl,0);}
function layoutTB(){const hp=hookPos(), ep=eyePos();
  tbHook.position.copy(hp).add(new THREE.Vector3(0,0.0,0));tbEye.position.copy(ep).add(new THREE.Vector3(0,-0.022,0));
  const mid=(hp.y+0.07+ep.y-0.092)/2;tbBody.position.set(0,mid,0);tbBody.rotation.y=bodyRot;
  tbHook.position.y=hp.y; tbEye.position.y=ep.y-0.022;}
// --- стъпки
let step=0, t0=0;
const ease=x=>x<0?0:x>1?1:(1-Math.cos(Math.PI*x))/2;
function setVis(k){
  P.markB.visible=k>=1&&k<=6; P.markT.visible=k>=2&&k<=3; P.plumb.visible=k===2;
  P.holeT.visible=k===3; P.drillT.visible=k===3;
  P.anchor.visible=k>=4||k===0; P.tool.visible=k===4;
  P.ringT.visible=k>=5||k===0; P.holeB.visible=k===6; P.drillB.visible=k===6;
  P.ringB.visible=P.washer.visible=P.nut.visible=k>=7||k===0;
  P.tb.visible=k>=8||k===0;
  if(ropeMesh) ropeMesh.visible=k>=9||k===0;
}
const CAMS={beye:[[0.5,0.98,0.62],[0,0.8,0]],under:[[0.55,0.22,0.65],[0,0.44,0]],all:[[1.7,1.55,2.45],[0,1.2,0]],top:[[0.42,1.72,0.6],[0,1.95,0]],bottom:[[0.48,0.8,0.62],[0,0.5,0]]};
let camFrom=null,camTo=null,tgFrom=null,tgTo=null;
function go(k,keepCam){step=Math.max(0,Math.min(STEPS.length-1,k));t0=performance.now();
  const s=STEPS[step];document.getElementById('stepNo').textContent=step===0?'Преглед':'Стъпка '+step+' от '+(STEPS.length-1);
  document.getElementById('stepTitle').textContent=s.t;document.getElementById('stepText').textContent=s.d;
  document.getElementById('stepParts').textContent=s.p?('Трябва ви: '+s.p):'';
  document.getElementById('counter').textContent=step+' / '+(STEPS.length-1);
  document.getElementById('prev').disabled=step===0;document.getElementById('next').disabled=step===STEPS.length-1;
  [...document.querySelectorAll('#list li')].forEach((li,i)=>li.classList.toggle('on',i===step));
  if(!keepCam){const c=CAMS[s.cam];camFrom=camera.position.clone();tgFrom=controls.target.clone();camTo=new THREE.Vector3(...c[0]);tgTo=new THREE.Vector3(...c[1]);}
  setVis(step);}
function anim(now){
  const e=(now-t0)/1000, k=step;
  // камера
  if(camTo){const a=ease(Math.min(1,e/1.0));camera.position.lerpVectors(camFrom,camTo,a);controls.target.lerpVectors(tgFrom,tgTo,a);if(a>=1)camTo=null;}
  // анкер/ринг горе
  const up=(obj,fin,from,dur,spin)=>{const a=ease(Math.min(1,e/dur));obj.position.set(fin.x,fin.y+from*(1-a),fin.z);if(spin)obj.rotation.y=(1-a)*spin;};
  P.markB.scale.setScalar(k===1?1+0.25*Math.sin(e*6):1);
  if(k===2){const a=ease(Math.min(1,e/1.2));P.plumb.scale.y=1;P.markT.material.opacity=1;P.markT.visible=a>0.9;}
  if(k===3){const a=ease(Math.min(1,e/1.6));P.drillT.position.set(0,CY-0.62+0.5*a,0);P.drillT.rotation.y=e*30;P.holeT.scale.y=a;P.holeT.position.y=CY+0.06*a;}
  if(k===4){up(P.anchor,FINAL.anchor,-0.35,1.0);const tap=Math.max(0,e-1.0);P.tool.position.set(0,CY-Math.abs(Math.sin(tap*7))*0.05*(tap<2.5?1:0)-(e<1?0.4*(1-e):0),0);}
  else if(k>4||k===0){P.anchor.position.copy(FINAL.anchor);}
  if(k===5){up(P.ringT,FINAL.ringT,-0.3,1.6,Math.PI*8);}else if(k>5||k===0){P.ringT.position.copy(FINAL.ringT);P.ringT.rotation.y=0;}
  if(k===6){const a=ease(Math.min(1,e/1.5));P.drillB.position.set(0,TY+0.45-0.42*a,0);P.drillB.rotation.y=e*30;P.holeB.scale.y=Math.max(0.01,a);}
  if(k===7){up(P.ringB,FINAL.ringB,0.3,1.0,Math.PI*6);const a2=Math.max(0,e-1.0);
    up(P.washer,FINAL.washer,-0.25,1.0);P.washer.position.y=FINAL.washer.y-0.25*(1-ease(Math.min(1,a2/0.8)));
    P.nut.position.y=FINAL.nut.y-0.25*(1-ease(Math.min(1,a2/1.2)));P.nut.rotation.y=(1-ease(Math.min(1,a2/1.2)))*Math.PI*8;}
  else if(k>7||k===0){P.ringB.position.copy(FINAL.ringB);P.ringB.rotation.y=0;P.washer.position.copy(FINAL.washer);P.nut.position.copy(FINAL.nut);}
  // обтегач и въже
  let attach=0,sag=1;
  if(k===0||k===12){tl=0;bodyRot=0;attach=1;sag=0;}
  else if(k<8){tl=1;}
  else if(k>=8&&k<=10){tl=1;bodyRot=0;}
  if(k===11){const a=ease(Math.min(1,e/2.2));tl=1-a;bodyRot=a*Math.PI*10;attach=1;sag=1-a;}
  if(k===10){attach=1;sag=1;}
  if(k===9){attach=0;sag=0.3;}
  layoutTB();
  if(k===8){const a=ease(Math.min(1,e/1.0));P.tb.position.set(0,0.3*(1-a),0);}else P.tb.position.set(0,0,0);
  if(k>=9||k===0){const key=k+':'+tl.toFixed(3)+':'+sag.toFixed(3)+':'+attach;if(key!==anim.last){buildRope(attach,sag);anim.last=key;}
    if(k===9){const a=ease(Math.min(1,e/1.2));ropeMesh.position.y=-0.4*(1-a);}else ropeMesh.position.y=0;}
  if(ropeMesh) ropeMesh.visible=k>=9||k===0;
  HW.top.visible=k>=9||k===0; HW.bot.visible=k>=10||k===0; HW.top.position.y+= (ropeMesh?ropeMesh.position.y:0)*0;
  [['top',9],['bot',10]].forEach(([n,st])=>{const h=HW[n],pl=h.userData.pl;pl.visible=(k===st);
    if(k===st){const c=Math.min(1,Math.max(0,(e-1.4)/0.5)), open=0.035*(1-c)+0.0;h.userData.jaws[0].position.x=open;h.userData.jaws[1].position.x=-open;}});
  controls.update();renderer.render(scene,camera);requestAnimationFrame(anim);
}
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);resize();
const list=document.getElementById('list');
STEPS.forEach((s,i)=>{const li=document.createElement('li');li.textContent=i===0?'Преглед: крайният резултат':s.t;li.onclick=()=>go(i);list.appendChild(li);});
document.getElementById('next').onclick=()=>go(step+1);
document.getElementById('prev').onclick=()=>go(step-1);
document.getElementById('replay').onclick=()=>go(step,true);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(step+1);if(e.key==='ArrowLeft')go(step-1);});
camera.position.set(1.7,1.55,2.45);controls.target.set(0,1.2,0);
buildRope(1,0);go(0);requestAnimationFrame(anim);
</script>
