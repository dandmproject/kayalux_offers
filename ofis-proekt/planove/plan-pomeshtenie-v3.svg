<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Arial, sans-serif" font-size="14">
  <rect width="1000" height="760" fill="#fff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold">Помещение — поглед отгоре (версия 3, по двете снимки)</text>
  <text x="500" y="52" text-anchor="middle" fill="#b00">Червеното с „?“ е неизвестно — само 2 размера липсват</text>

  <g transform="translate(170,110)">
    <!-- стая: широчина 4,38 м (1 м = 130 px = 569 px); дълбочина ? прието 3,30 м = 429 px -->
    <rect x="0" y="0" width="569" height="429" fill="#fafafa" stroke="#000" stroke-width="4"/>
    <text x="285" y="-12" text-anchor="middle" font-weight="bold">ЗАДНА СТЕНА (със стълбата)</text>
    <text x="285" y="470" text-anchor="middle" font-weight="bold">ПРЕДНА СТЕНА (вход) ≈ 4,38 м</text>
    <text x="-12" y="215" text-anchor="end" font-weight="bold">ЛЯВА</text>
    <text x="-12" y="232" text-anchor="end" font-weight="bold">(радиатор)</text>
    <text x="582" y="215" font-weight="bold">ДЯСНА</text>
    <text x="582" y="232" font-weight="bold">(WC)</text>

    <!-- мецанин: дясната ивица, по цялата дълбочина -->
    <rect x="326" y="2" width="241" height="425" fill="#f1e9dc" stroke="#e67e22" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="446" y="200" text-anchor="middle" font-weight="bold">МЕЦАНИН (ет. 2)</text>
    <text x="446" y="218" text-anchor="middle" font-size="12">по цялата дясна стена</text>
    <text x="446" y="236" text-anchor="middle" font-size="12" fill="#b00">широк 1,87 м ?</text>
    <text x="446" y="254" text-anchor="middle" font-size="12">отдолу височина 2,54 м</text>

    <!-- WC в задния десен ъгъл -->
    <rect x="466" y="2" width="101" height="140" fill="#dbe9f7" stroke="#2a5d8f" stroke-width="2"/>
    <text x="516" y="70" text-anchor="middle" fill="#2a5d8f" font-weight="bold">WC</text>
    <text x="516" y="88" text-anchor="middle" font-size="11" fill="#2a5d8f">(под мецанина)</text>
    <line x1="466" y1="30" x2="466" y2="108" stroke="#fff" stroke-width="5"/>
    <path d="M466 30 A78 78 0 0 0 388 108" fill="none" stroke="#2a5d8f" stroke-dasharray="4 3"/>
    <text x="380" y="130" font-size="11" fill="#2a5d8f">врата WC 60</text>
    <!-- контакт на дясната стена до пода -->
    <rect x="560" y="300" width="7" height="22" fill="#555"/>
    <text x="545" y="345" text-anchor="end" font-size="11">контакт</text>

    <!-- колона -->
    <circle cx="326" cy="150" r="7" fill="#333"/>
    <text x="300" y="175" text-anchor="end" font-size="11">колона</text>

    <!-- стълба по задната стена, отляво надясно към мецанина -->
    <rect x="78" y="2" width="248" height="91" fill="#d9c7a8" stroke="#6b4f2a"/>
    <g stroke="#6b4f2a">
      <line x1="100" y1="2" x2="100" y2="93"/><line x1="123" y1="2" x2="123" y2="93"/>
      <line x1="145" y1="2" x2="145" y2="93"/><line x1="168" y1="2" x2="168" y2="93"/>
      <line x1="190" y1="2" x2="190" y2="93"/><line x1="213" y1="2" x2="213" y2="93"/>
      <line x1="235" y1="2" x2="235" y2="93"/><line x1="258" y1="2" x2="258" y2="93"/>
      <line x1="280" y1="2" x2="280" y2="93"/><line x1="303" y1="2" x2="303" y2="93"/>
    </g>
    <path d="M90 48 L318 48" stroke="#6b4f2a" stroke-width="2" marker-end="url(#a)"/>
    <text x="202" y="112" text-anchor="middle" font-size="12">стълба: 11 стъпала, 70 см широка, качва се надясно</text>
    <text x="38" y="30" text-anchor="middle" font-size="12">60 см</text>

    <!-- тръби, радиатор -->
    <circle cx="8" cy="8" r="5" fill="#1f6fb2"/>
    <text x="16" y="24" font-size="11" fill="#1f6fb2">тръби</text>
    <rect x="2" y="220" width="10" height="190" fill="#c0392b"/>
    <text x="18" y="320" font-size="12" fill="#c0392b">радиатор</text>

    <!-- вход -->
    <line x1="72" y1="429" x2="195" y2="429" stroke="#fff" stroke-width="7"/>
    <path d="M195 429 A123 123 0 0 0 72 306" fill="none" stroke="#000" stroke-dasharray="5 4"/>
    <text x="134" y="452" text-anchor="middle" font-size="12">вход 95</text>
    <text x="36" y="452" text-anchor="middle" font-size="12">55</text>
    <text x="382" y="452" text-anchor="middle" font-size="12">2,88 м</text>

    <text x="-12" y="400" text-anchor="end" fill="#b00">дълбочина ?</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6b4f2a"/></marker></defs>
  <text x="500" y="740" text-anchor="middle" font-size="12" fill="#666">Не е в точен мащаб, докато не се потвърдят червените размери.</text>
</svg>
